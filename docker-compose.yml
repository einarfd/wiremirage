# docker-compose for WireMirage.
#
# Two services:
#   - valkey  : the storage backend, always available
#   - wm-host : the host binary, pulled from GHCR (the image CI publishes).
#               Gated by the `full` profile so the default
#               `docker compose up -d` matches the dev workflow
#               (Valkey only; you `cargo run -p wm-host` against it).
#
# Quickstart — dev (Valkey only, host via cargo):
#
#   docker compose up -d
#   WM_BOOTSTRAP_TOKEN=wmt_dev_local \
#     WM_BOOTSTRAP_EMAIL=admin@local \
#     WM_STORAGE=redis://localhost:6379 \
#     cargo run -p wm-host
#
# Quickstart — full stack (Valkey + host both in compose), pulling the
# published image:
#
#   WM_BOOTSTRAP_TOKEN=wmt_dev_local WM_BOOTSTRAP_EMAIL=admin@local \
#     docker compose --profile full up -d
#
# Build the host image from source instead (testing a local change to the
# prod-shaped build) by layering the dev override — see docker-compose.dev.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml \
#     --profile full up -d --build      # (or: just run-web-docker)
#
# The host listens on 8080; Valkey on 6379. Source-language handlers
# compile in-host (ADR-0020); no Node sidecar.

services:
  valkey:
    image: valkey/valkey:9
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    restart: unless-stopped

  wm-host:
    profiles: [full]
    # Pulled from GHCR (published by CI on pushes to main). Override the
    # tag/registry with WM_IMAGE, e.g.
    #   WM_IMAGE=ghcr.io/einarfd/wiremirage:sha-abc1234 docker compose ...
    # To build from source instead, layer docker-compose.dev.yml (see the
    # header comment / `just run-web-docker`).
    image: ${WM_IMAGE:-ghcr.io/einarfd/wiremirage:latest}
    ports:
      - "8080:8080"
    # Container config comes from the curated `.env`, forwarded wholesale
    # via `env_file` — so there is NO second passthrough list to keep in
    # sync. Adding a config var to `.env` is enough; you can't forget to
    # also name it here. (This replaces a hand-maintained `- KEY` list that
    # silently dropped `WM_TRUSTED_PROXY` after ADR-0027 — see the commit.)
    # `.env` holds only vars meant for the container, and a var absent from
    # the file is absent in the container (no empty-string surprises, the
    # property the old list-form protected). For prod the deploy renders
    # `.env`; for dev `just run-web-docker` writes one. `required: false`
    # keeps `docker compose` usable when no `.env` is present.
    env_file:
      - path: .env
        required: false
    environment:
      # Literals — fixed by the compose topology, override anything in
      # `.env` (storage points at the valkey service; bind all interfaces
      # so the published port works).
      - WM_STORAGE=redis://valkey:6379
      - WM_LISTEN_ADDR=0.0.0.0:8080
    depends_on:
      - valkey
    restart: unless-stopped

volumes:
  valkey-data:
