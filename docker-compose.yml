# docker-compose for WireMirage.
#
# Two services:
#   - valkey  : the storage backend, always available
#   - wm-host : the host binary, built from the repo's Dockerfile.
#               Gated by the `full` profile so the default
#               `docker compose up -d` matches the dev workflow
#               (Valkey only; you `cargo run -p wm-host` against it).
#
# Quickstart — dev (Valkey only, host via cargo):
#
#   docker compose up -d
#   WM_BOOTSTRAP_TOKEN=wmt_dev_local \
#     WM_STORAGE=redis://localhost:6379 \
#     cargo run -p wm-host
#
# Quickstart — full stack (Valkey + host both in compose):
#
#   WM_BOOTSTRAP_TOKEN=wmt_dev_local \
#     docker compose --profile full up -d --build
#
# The host listens on 8080; Valkey on 6379. Source-language handlers
# compile in-host (ADR-0020); no Node sidecar.

services:
  valkey:
    image: valkey/valkey:8
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    restart: unless-stopped

  wm-host:
    profiles: [full]
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      WM_STORAGE: redis://valkey:6379
      WM_BOOTSTRAP_TOKEN: ${WM_BOOTSTRAP_TOKEN:?set WM_BOOTSTRAP_TOKEN to e.g. wmt_dev_local}
      WM_LISTEN_ADDR: 0.0.0.0:8080
      # Every WireMirage env var the host recognises has to be listed
      # here for it to reach the container — compose's `${VAR}`
      # interpolation reads from shell env (dev) and `.env` (prod), but
      # the container only sees what `environment:` enumerates. Empty
      # defaults mean "not configured" and match how the host treats
      # unset env vars (see README → Configuration).
      WM_LOCAL_AUTH: ${WM_LOCAL_AUTH:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      WM_GITHUB_CLIENT_ID: ${WM_GITHUB_CLIENT_ID:-}
      WM_GITHUB_CLIENT_SECRET: ${WM_GITHUB_CLIENT_SECRET:-}
      WM_GITHUB_ALLOW_USERS: ${WM_GITHUB_ALLOW_USERS:-}
      WM_GITHUB_ALLOW_ORGS: ${WM_GITHUB_ALLOW_ORGS:-}
      WM_GITHUB_ADMIN_USERS: ${WM_GITHUB_ADMIN_USERS:-}
      WM_SECURE_COOKIES: ${WM_SECURE_COOKIES:-}
      WM_TRUST_FORWARDED_HEADERS: ${WM_TRUST_FORWARDED_HEADERS:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
    depends_on:
      - valkey
    restart: unless-stopped

volumes:
  valkey-data:
