# Slice 4 docker-compose: brings up Valkey, the only external dependency
# WireMirage needs. The host itself runs locally for now
# (`cargo run -p wm-host`) — a host Dockerfile lands in a follow-up
# deployment slice. ADR-0020 retired the Node TypeScript compiler
# sidecar; source-language handlers now compile in-host.
#
# Quickstart:
#
#   docker compose up -d
#   WM_BOOTSTRAP_TOKEN=wmt_dev_local \
#     WM_STORAGE=redis://localhost:6379 \
#     cargo run -p wm-host
#
# The host listens on 8080 by default; Valkey on 6379.

services:
  valkey:
    image: valkey/valkey:8
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    restart: unless-stopped

volumes:
  valkey-data:
