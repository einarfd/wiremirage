# docker-compose for WireMirage.
#
# Two services:
#   - valkey  : the storage backend, always available
#   - wm-host : the host binary, built from the repo's Dockerfile.
#               Gated by the `full` profile so the default
#               `docker compose up -d` matches the dev workflow
#               (Valkey only; you `cargo run -p wm-host` against it).
#
# Quickstart — dev (Valkey only, host via cargo):
#
#   docker compose up -d
#   WM_BOOTSTRAP_TOKEN=wmt_dev_local \
#     WM_STORAGE=redis://localhost:6379 \
#     cargo run -p wm-host
#
# Quickstart — full stack (Valkey + host both in compose):
#
#   WM_BOOTSTRAP_TOKEN=wmt_dev_local \
#     docker compose --profile full up -d --build
#
# The host listens on 8080; Valkey on 6379. Source-language handlers
# compile in-host (ADR-0020); no Node sidecar.

services:
  valkey:
    image: valkey/valkey:8
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    restart: unless-stopped

  wm-host:
    profiles: [full]
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    # List-form environment so optional vars are passed through only
    # when set in the host env (`.env` file or shell). With map-form
    # `${VAR:-}`, missing vars get set to empty strings in the container,
    # which the host then has to special-case (and using `:?` for the
    # bootstrap token broke prod after we dropped it from `.env.tmpl`
    # post-retirement). The list-form `- KEY` syntax passes KEY through
    # iff it's set; otherwise it's not present in the container env
    # at all, which is what the host actually expects for "unset."
    environment:
      # Literals — set unconditionally regardless of host env.
      - WM_STORAGE=redis://valkey:6379
      - WM_LISTEN_ADDR=0.0.0.0:8080
      # Passthroughs — present in the container only if the host env
      # supplies them. See README → Configuration for what each does.
      - WM_BOOTSTRAP_TOKEN
      - WM_LOCAL_AUTH
      - SESSION_SECRET
      - WM_GITHUB_CLIENT_ID
      - WM_GITHUB_CLIENT_SECRET
      - WM_GITHUB_ALLOW_USERS
      - WM_GITHUB_ALLOW_ORGS
      - WM_GITHUB_ADMIN_USERS
      - WM_SECURE_COOKIES
      - WM_TRUST_FORWARDED_HEADERS
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - OTEL_SERVICE_NAME
      - OTEL_RESOURCE_ATTRIBUTES
      - WM_MCP_ALLOWED_HOSTS
    depends_on:
      - valkey
    restart: unless-stopped

volumes:
  valkey-data:
