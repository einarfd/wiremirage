{{- if and .Values.podDisruptionBudget.enabled (gt (int .Values.replicaCount) 1) }}
{{- /*
  Only for more than one replica. A PDB with minAvailable: 1 over a
  single replica makes node drains block forever instead of protecting
  availability, which is worse than having no PDB at all.
*/}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "wiremirage.fullname" . }}
  labels:
    {{- include "wiremirage.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "wiremirage.selectorLabels" . | nindent 6 }}
{{- end }}
