name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-tools
        # The host's build.rs invokes wasm-tools to componentize fixture
        # guests; tier-2 integration tests load those components.
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (host)
        run: cargo test --workspace

      - name: Test (Valkey-backed, tier-3)
        # Spins up real `valkey/valkey:8` containers via testcontainers-rs.
        # GitHub-hosted runners have Docker available; ryuk reaps stragglers.
        run: cargo test -p wm-host --features valkey-tests --test valkey_storage

      - name: Build
        run: cargo build --workspace
