name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Link native (x86_64) binaries with mold — ~3x faster than GNU ld on
  # the large wasmtime+swc test binaries, which dominate CI wall time
  # (~28 integration-test executables, each a full static link).
  #
  # Scoped to the x86_64 target on purpose: a blanket RUSTFLAGS would also
  # reach the wasm32-unknown-unknown fixture builds (build.rs), which link
  # with rust-lld and would choke on `-fuse-ld=mold`. Kept here (CI only)
  # rather than in `.cargo/config.toml` so local dev isn't forced to
  # install mold; see the README for the opt-in local snippet.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-Clink-arg=-fuse-ld=mold"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHA runners ship with ~30 GB of preinstalled tooling (Android SDK,
      # .NET, Haskell, large GHC versions) that we don't use. swc +
      # wasmtime + cranelift produce a target/ that easily exceeds the
      # remaining disk; the linker then SIGBUSes mid-link. Free the
      # space before we start building.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      # mold linker (see the CARGO_TARGET_*_RUSTFLAGS above). In Ubuntu's
      # universe repo; the runner has it enabled.
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-tools
        # The host's build.rs invokes wasm-tools to componentize fixture
        # guests; tier-2 integration tests load those components.
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (host)
        run: cargo test --workspace

      - name: Test (Valkey-backed, tier-3)
        # Spins up real `valkey/valkey:8` containers via testcontainers-rs.
        # GitHub-hosted runners have Docker available; ryuk reaps stragglers.
        run: cargo test -p wm-host --features valkey-tests --test valkey_storage

      - name: Build
        run: cargo build --workspace
