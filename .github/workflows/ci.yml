name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Container image published to GHCR on pushes to main (the `image-build`
  # + `image-publish` jobs below), tagged `:main` and `:sha-<short>`.
  # `:latest` deliberately does NOT come from here — release.yml moves it to
  # the newest stable tag, so `:latest` means "newest release" and `:main`
  # means "tip of main". github.repository is already lowercase
  # (`einarfd/wiremirage`), so it's a valid image path as-is.
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Three parallel jobs sharing one composite setup. The `test` job is the
# long pole (~17 min of compile + run); splitting `lint` and `build` out
# of its critical path shaves a few minutes of wall-clock and — more
# usefully — surfaces fmt/clippy/build failures in a few minutes instead
# of after the full test step. Each job recompiles the workspace from a
# cached dependency tree; that's inherent (rust-cache only caches deps),
# not duplicated work the split introduced.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140

      - name: Test (host)
        run: cargo nextest run --workspace --profile ci

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nextest-junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Test (Valkey-backed, tier-3)
        # Spins up real `valkey/valkey:9` containers via testcontainers-rs.
        # GitHub-hosted runners have Docker available; ryuk reaps stragglers.
        run: cargo test -p wm-host --features valkey-tests --test valkey_storage

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - name: Build
        run: cargo build --workspace

      # `types/wiremirage-handler.d.ts` is what handler authors write code
      # against, and it is hand-written (ADR-0038), so something has to prove
      # a real handler still compiles against it. The Rust test
      # `handler_types_track_wit` covers the other half — that it still
      # matches the WIT. This step is cheap here because `cargo build` above
      # already built the js-engine image this borrows typescript from.
      # Mirrors `just typecheck` — inlined because ci-setup doesn't install
      # just, and pulling it in for one step would slow every job.
      - name: Type-check the shipped handler types
        run: |
          docker build --quiet -t wm-js-engine-builder:dev compiler/js-engine
          docker run --rm -v "$PWD/types":/types -w /app wm-js-engine-builder:dev \
            npx tsc --noEmit -p /types/tsconfig.json

  # Dependency audit: security advisories, license policy, banned crates,
  # and source registries. Reads Cargo.lock — no compile — so it skips
  # ci-setup entirely and finishes in well under a minute, which makes it
  # the first job to report on a dependency-bump PR. Policy and the
  # justification for every ignore live in deny.toml.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-deny
        # Pinned for the same reason as wasm-tools in ci-setup: a fresh
        # release whose assets haven't hit the download CDN yet 404s.
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: cargo-deny
        run: cargo deny --workspace check

  # ── Container image (push to main only) ──────────────────────────────────
  #
  # Builds the release image from the repo-root Dockerfile and publishes a
  # multi-arch manifest to GHCR, which docker-compose.yml pulls instead of
  # building on the host. Mirrors the arkiv setup.
  #
  # Each architecture builds on its own native runner (no QEMU) and pushes
  # by digest; `image-publish` assembles the manifest list and tags it.
  #
  # One-time maintainer setup: after the first successful run, set the GHCR
  # package "wiremirage" visibility to Public (repo → Packages → wiremirage →
  # Package settings) so `docker compose pull` works unauthenticated. No
  # secrets to configure — pushes use the built-in GITHUB_TOKEN.
  #
  # The image build is heavy (Rust release + the wasm fixtures build.rs
  # compiles + the js-engine via componentize-js), so it's gated to pushes
  # and leans on the GHA layer cache (`cache-from`/`cache-to`).
  image-build:
    name: Image (${{ matrix.platform }})
    needs: [lint, test]
    if: github.event_name == 'push'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Prepare platform tag
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image-publish:
    name: Publish image manifest
    needs: image-build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha

      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}

      - name: Inspect published image
        run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
