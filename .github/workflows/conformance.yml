name: Conformance

# Opt-in / manual. Runs real third-party client libraries (each in its own
# Docker image) against WireMirage mocks to smoke out fidelity gaps (SSE
# framing, content-type, error shape) the unit suite can't see. NOT on every
# PR — it builds + boots the host and builds/pulls SDK images, so it's heavier
# than the gating CI. Trigger it from the Actions tab (or on a schedule) when
# touching dispatch / streaming / the engine.
on:
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      # Docker + jq are preinstalled on ubuntu-latest; ci-setup provides the
      # Rust toolchain + wasm-tools the host build needs.
      - name: Run conformance lanes
        run: ./conformance/run.sh
