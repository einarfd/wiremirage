name: Conformance

# Runs real third-party client libraries (each in its own Docker image)
# against WireMirage mocks to smoke out fidelity gaps (SSE framing,
# content-type, error shape) the unit suite can't see. NOT on every PR — it
# builds + boots the host and builds/pulls SDK images, so it's heavier than
# the gating CI.
#
# Weekly + manual. The schedule exists because the lanes pin third-party SDKs
# and base images: without it, a fidelity regression (ours or an SDK's) sits
# undiscovered until someone remembers to press the button. Weekly bounds that
# to seven days without gating anyone's PR. Trigger it by hand when touching
# dispatch / streaming / the engine.
on:
  workflow_dispatch:
  schedule:
    # Mondays, 05:17 UTC. Off the hour so it doesn't pile into the
    # top-of-hour runner crush.
    - cron: "17 5 * * 1"

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
        with:
          # Weekly cadence means this job usually builds cold (GitHub evicts
          # caches unused for 7 days, which is exactly this cron's period).
          # Keeping the cache from a failed run means a re-run — or a hand
          # triggered retry of a genuinely failing lane — doesn't pay for the
          # whole workspace again.
          cache-on-failure: "true"
      # Docker + jq are preinstalled on ubuntu-latest; ci-setup provides the
      # Rust toolchain + wasm-tools the host build needs.
      - name: Run conformance lanes
        run: ./conformance/run.sh
