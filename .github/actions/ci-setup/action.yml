name: CI setup
description: >-
  Shared setup for the parallel CI jobs: free runner disk, install the
  Rust toolchain (+ wasm32 target for the build.rs fixture/js-engine
  componentization), restore the cargo cache, and install wasm-tools.

inputs:
  toolchain:
    description: >-
      Rust toolchain to install. Defaults to `stable` for the gating
      jobs; the MSRV job passes an explicit version so the
      `rust-version` in Cargo.toml is checked by something rather than
      being a claim nothing verifies.
    required: false
    default: stable
  cache-on-failure:
    description: >-
      Save the cargo cache even when the job fails. Off for the gating CI
      jobs (a failed build's target/ isn't worth persisting when the next
      push rebuilds anyway); on for the weekly conformance job, where a
      cold build is most of the runtime and a failure otherwise throws it
      away — which is how the first scheduled run became a permanent
      failure: no cache, build overran the readiness wait, failure saved
      nothing, repeat.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # GHA runners ship with ~30 GB of preinstalled tooling (Android SDK,
    # .NET, Haskell, large GHC versions) that we don't use. swc +
    # wasmtime + cranelift produce a target/ that easily exceeds the
    # remaining disk; the linker then SIGBUSes mid-link. Free the space
    # before we start building.
    - name: Free disk space
      # Pinned to a release, not @main: a floating branch ref runs
      # whatever a third party pushed, with the runner's token, on every
      # CI run. Dependabot can't help with a branch ref either — it only
      # bumps resolvable versions.
      uses: jlumbroso/free-disk-space@v1.3.1
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: false
        swap-storage: false

    # The `@stable` ref is the action version, not the toolchain: the
    # `toolchain` input below is what selects the compiler, so the ref
    # stays pinned (see the free-disk-space note above) while callers
    # can still ask for a specific version.
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.toolchain }}
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown

    # Installing a pinned toolchain is not enough to *use* it:
    # rust-toolchain.toml pins `channel = "stable"`, and a toolchain file
    # outranks the `rustup default` the action above sets. RUSTUP_TOOLCHAIN
    # outranks the file in turn. Exported here, before the cache step, so
    # the rust-cache key is computed against the pinned compiler too —
    # keying it under stable would risk restoring artifacts built by a
    # different rustc.
    - name: Make the pinned toolchain win over rust-toolchain.toml
      if: inputs.toolchain != 'stable'
      shell: bash
      env:
        WANT: ${{ inputs.toolchain }}
      run: echo "RUSTUP_TOOLCHAIN=$WANT" >> "$GITHUB_ENV"

    # Assert rather than trust. The first version of the MSRV job did
    # exactly what the step above prevents — installed a pinned toolchain,
    # then compiled on stable — and would have reported a green check that
    # proved nothing. Silent false assurance is worse than no check.
    - name: Confirm the pinned toolchain is active
      if: inputs.toolchain != 'stable'
      shell: bash
      env:
        WANT: ${{ inputs.toolchain }}
      run: |
        set -euo pipefail
        got="$(rustc --version)"
        echo "$got"
        case "$got" in
          "rustc $WANT "*) ;;
          *) echo "::error::expected rustc $WANT, got: $got"
             exit 1 ;;
        esac

    # Per-job cache (rust-cache keys by job, so each job keeps a stable
    # cache and they don't thrash each other — the test job compiles the
    # valkey-tests feature the others don't, so a shared key would
    # invalidate on every run).
    - uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: ${{ inputs.cache-on-failure }}

    - name: Install wasm-tools
      # The host's build.rs invokes wasm-tools to componentize fixture
      # guests; tier-2 integration tests load those components.
      # Pinned (not @latest): tracking latest means CI breaks whenever a
      # new wasm-tools release's assets haven't propagated to the
      # download CDN yet (a fresh release 404s the install for a while).
      # `component new` is stable across these versions; bump
      # deliberately when a newer wasm-tools feature is actually needed.
      uses: taiki-e/install-action@v2
      with:
        tool: wasm-tools@1.249.0
