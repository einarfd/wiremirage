version: 2

# Keeps the version audit continuous instead of something someone
# remembers to run. cargo-deny (the `audit` CI job) catches advisories on
# what we already depend on; Dependabot is the other half — it moves the
# pins forward before an advisory lands on them.
#
# Grouping policy: semver-compatible updates arrive as one PR per
# ecosystem per week, because reviewing thirty individual patch bumps is
# how a dependency PR queue gets ignored. Majors stay ungrouped — those
# are decisions (see the pending typescript 6 -> 7, which is the Go port)
# and each deserves its own PR.
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # minijinja 2 -> 3 is deferred deliberately — see #75 for the
      # measured scope and the triggers that reopen it (a 3.x feature
      # we want, or a security/unmaintained event on 2.x, which the
      # audit CI job fails on regardless of this rule). It is a real
      # migration (v3's context! needs Serde wraps at ~29 call
      # sites), not a version bump. Semver-major only, and the
      # update-types shape is what keeps Dependabot security-update
      # PRs flowing — don't widen it to a bare version range.
      - dependency-name: "minijinja"
        update-types: ["version-update:semver-major"]
    groups:
      cargo-compatible:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    # Workflows plus the composite action they share — Dependabot only
    # scans the directory it is pointed at, and ci-setup pins tool
    # versions of its own.
    directories:
      - "/"
      - "/.github/actions/ci-setup"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-compatible:
        update-types: [minor, patch]

  - package-ecosystem: docker
    # Release + conformance images follow whatever tag they use.
    directories:
      - "/"                            # release image
      - "/conformance/openai-streaming"
      - "/conformance/s3-slowdown"
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker
    # The js-engine builder is digest-pinned on the Node LTS line
    # (24-bookworm-slim). Node 25 is the non-LTS current line, and
    # `npm ci` dies under it (exit 152), which breaks every cargo
    # test via the build.rs engine build — see the #59 experiment.
    # Take major bumps of this base image deliberately, once
    # componentize-js supports them; minors and patches keep flowing
    # (the LTS tag moves within 24).
    directory: "/compiler/js-engine"
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    # componentize-js + typescript, the js-engine build inputs.
    directory: "/compiler/js-engine"
    schedule:
      interval: weekly
      day: monday
