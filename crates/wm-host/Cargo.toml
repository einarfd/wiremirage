[package]
name = "wm-host"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "wm-host"
path = "src/main.rs"

[dependencies]
wm-core = { path = "../wm-core" }
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
wasmtime = { workspace = true, features = ["component-model", "runtime", "cranelift"] }
axum.workspace = true
http.workspace = true
http-body-util.workspace = true
redis.workspace = true
ulid.workspace = true
base64.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
rand.workspace = true
sha2.workspace = true
hex.workspace = true
rmcp.workspace = true
schemars.workspace = true
tower = "0.5"
# Local auth (slice 20): argon2id for password hashing, hmac+sha2 for
# signed session cookies. argon2id is OWASP's recommendation; the
# `argon2` crate is pure Rust and audit-friendly.
argon2 = "0.5"
hmac = "0.12"
subtle = "2.6"
# Web UI templates (slice 21). minijinja gives us Jinja-like syntax
# with a small dependency footprint. Templates are embedded via
# `include_str!` at compile time so deployment stays single-binary.
minijinja = { version = "2", default-features = false, features = ["builtins", "multi_template", "serde", "json"] }
# Web UI (slice 22) — query-string building for pagination + sort links.
# A handful of `urlencoding::encode` calls; the crate is ~50 LOC of safe
# Rust and pulls no other deps.
urlencoding = "2"

[features]
# Enables tier-3 integration tests that spin up a real Valkey container via
# testcontainers-rs. Requires Docker. Disabled by default so plain
# `cargo test` stays fast and works without Docker; CI enables it.
valkey-tests = []
# Enables tier-3 integration tests that spin up the TypeScript compiler
# sidecar Docker image. Requires Docker AND a pre-built
# `wiremirage/compiler-typescript:dev` image (built via
# `compiler/typescript/Dockerfile`).
sidecar-tests = []

[dev-dependencies]
hyper.workspace = true
testcontainers.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
# rmcp client features for tier-2 MCP integration tests. Pull just enough
# to drive a streamable-HTTP client at /__api/mcp from inside our axum
# in-process harness.
rmcp = { version = "1.6", default-features = false, features = ["client", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "reqwest"] }
