[package]
name = "wm-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "wm-host"
path = "src/main.rs"

[dependencies]
wm-core = { path = "../wm-core" }
# Pure-Rust TypeScript transpile (ADR-0020 slice B, ADR-0038). Its own
# crate so build.rs can use the same code for engine.ts; see its manifest.
wm-transpile = { path = "../wm-transpile" }
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
wasmtime = { workspace = true, features = ["component-model", "runtime", "cranelift"] }
axum.workspace = true
http.workspace = true
redis.workspace = true
ulid.workspace = true
base64.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
rand.workspace = true
sha2.workspace = true
hex.workspace = true
rmcp.workspace = true
schemars.workspace = true
tower = "0.5"
# Outbound-callback egress policy (ADR-0034): CIDR parsing + containment for the
# special-use default-deny and the WM_EGRESS_ALLOW/DENY overrides (v4 + v6).
ipnet = "2"
# Local auth (slice 20): argon2id for password hashing, hmac+sha2 for
# signed session cookies. argon2id is OWASP's recommendation; the
# `argon2` crate is pure Rust and audit-friendly.
argon2 = "0.5"
hmac = "0.13"
subtle = "2.6"
# Web UI templates (slice 21). minijinja gives us Jinja-like syntax
# with a small dependency footprint. Templates are embedded via
# `include_str!` at compile time so deployment stays single-binary.
minijinja = { version = "2", default-features = false, features = ["builtins", "multi_template", "serde", "json"] }
# Web UI (slice 22) — query-string building for pagination + sort links.
# A handful of `urlencoding::encode` calls; the crate is ~50 LOC of safe
# Rust and pulls no other deps.
urlencoding = "2"

[features]
# Enables tier-3 integration tests that spin up a real Valkey container via
# testcontainers-rs. Requires Docker. Disabled by default so plain
# `cargo test` stays fast and works without Docker; CI enables it.
valkey-tests = []

[build-dependencies]
# build.rs transpiles compiler/js-engine/src/engine.ts with the very same
# code the runtime uses for user handlers (ADR-0038). Cargo shares the
# compiled artifact with the normal dependency above — the feature sets
# match, so this costs no extra compilation.
wm-transpile = { path = "../wm-transpile" }

[dev-dependencies]
hyper.workspace = true
testcontainers.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
# `testing` exposes `InMemoryMetricExporter`, used by the ADR-0024
# metrics smoke test. Dev-only feature add on top of the runtime dep.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
# rmcp client features for tier-2 MCP integration tests. Pull just enough
# to drive a streamable-HTTP client at /api/mcp from inside our axum
# in-process harness.
rmcp = { version = "3.1", default-features = false, features = ["client", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "reqwest"] }
