<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page_title }} — WireMirage</title>
<link rel="stylesheet" href="/ui/static/wm.css">
{%- block head %}{% endblock %}
</head>
<body>
<header class="app-header">
  <div class="app-header__inner">
    <a class="app-brand" href="/ui/">WireMirage</a>
    <nav class="app-nav" aria-label="Primary">
      <a href="/ui/">Home</a>
      <a href="/ui/connect">Connect</a>
      <a href="/ui/groups">Groups</a>
      <a href="/ui/routes">Routes</a>
      <a href="/ui/journal/live">Live</a>
      <a href="/ui/unmatched">Unmatched</a>
      {%- if user and user.is_admin %}
      <a href="/ui/admin">Admin</a>
      {%- endif %}
    </nav>
    {% if user %}
    <div class="app-user">
      <a class="identity{% if user.is_admin %} identity--admin{% endif %}" href="/ui/me"
         title="Your account — API tokens, MCP applications, sessions">
        <span class="identity__initials" aria-hidden="true">{{ user.initials }}</span>
        <span class="identity__email">{{ user.email }}</span>
        {%- if user.is_admin %}<span class="identity__role">admin</span>{% endif %}
      </a>
      <form method="post" action="/auth/logout" class="logout-form">
        <input type="hidden" name="_csrf" value="{{ csrf_token }}">
        <button type="submit" class="link-button">Log out</button>
      </form>
    </div>
    {% endif %}
  </div>
</header>

<main class="app-main">
{% block content %}{% endblock %}
</main>
</body>
</html>
