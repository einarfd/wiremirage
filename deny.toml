# cargo-deny configuration. Run locally with `just audit`; CI runs the
# same command in the `audit` job.
#
# The point of this file is that a dependency advisory becomes a build
# failure rather than something someone notices during a manual sweep.
# Every `ignore` below has to say why, and what would clear it.

[graph]
# Match what we actually ship + test on. The host only ever builds for
# the platform it runs on; scanning every exotic target would pull in
# advisories for code that is never compiled.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

[advisories]
# `unmaintained = "workspace"` flags an unmaintained crate only when it
# is one of ours, not when it is buried in a third-party tree we cannot
# act on. Our own unmaintained deps are actionable (see the serde_yml ->
# serde_norway swap); a transitive one usually is not.
unmaintained = "workspace"
yanked = "deny"
# Empty on purpose. Every advisory in the tree is currently cleared by a
# version, not by an exemption — keep it that way where it's cheap, and
# make anything added here say why and what would remove it.
ignore = []

[licenses]
# WireMirage is Apache-2.0. This list is what the dependency tree
# actually resolves to today — a new license showing up should be a
# decision, not a surprise.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are noise in a tree this size and never a
# correctness problem on their own.
multiple-versions = "allow"
# A wildcard version on a crates.io dependency means an unreviewed
# upgrade can land silently; on our own path dependencies it is just how
# an unpublished workspace refers to itself.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
