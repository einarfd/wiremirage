[workspace]
resolver = "3"
members = [
    "crates/wm-core",
    "crates/wm-host",
    "crates/wm-cli",
    "crates/wm-mcp",
]
# Wasm guest fixtures live outside the workspace so the wasm32 target
# doesn't pollute `cargo check --workspace` / `cargo clippy --workspace`.
# Each fixture crate is self-contained with its own Cargo.lock.
exclude = ["crates/wm-host/tests/fixtures"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/einarfd/wiremirage"
authors = ["Einar Fløystad Dørum <einarfd@mailthief.com>"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wasmtime = "44"
axum = "0.8"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
reqwest = { version = "0.12", default-features = false, features = ["http2"] }
redis = "1"
testcontainers = { version = "0.27", features = ["blocking"] }

[profile.release]
lto = "thin"
codegen-units = 1
