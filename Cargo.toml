[workspace]
resolver = "3"
members = [
    "crates/wm-core",
    "crates/wm-host",
    "crates/wm-cli",
    "crates/wm-mcp",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/einarfd/wiremirage"
authors = ["Einar Fløystad Dørum <einarfd@mailthief.com>"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
