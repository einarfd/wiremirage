[workspace]
resolver = "3"
members = [
    "crates/wm-core",
    "crates/wm-host",
    "crates/wm-cli",
]
# Wasm guest fixtures live outside the workspace so the wasm32 target
# doesn't pollute `cargo check --workspace` / `cargo clippy --workspace`.
# Each fixture crate is self-contained with its own Cargo.lock.
exclude = ["crates/wm-host/tests/fixtures"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/einarfd/wiremirage"
authors = ["Einar Fløystad Dørum <einarfd@mailthief.com>"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.32"
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio", "metrics"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["grpc-tonic", "trace", "metrics"] }
wasmtime = "44"
axum = "0.8"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "rustls", "stream"] }
redis = "1"
testcontainers = { version = "0.27", features = ["blocking"] }
ulid = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive", "env"] }
assert_cmd = "2"
rmcp = { version = "1.6", default-features = false, features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
schemars = { version = "1", features = ["chrono04"] }

[profile.release]
lto = "thin"
codegen-units = 1
