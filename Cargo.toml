[workspace]
resolver = "3"
members = [
    "crates/wm-core",
    "crates/wm-host",
    "crates/wm-cli",
    "crates/wm-transpile",
]
# Wasm guest fixtures live outside the workspace so the wasm32 target
# doesn't pollute `cargo check --workspace` / `cargo clippy --workspace`.
# Each fixture crate is self-contained with its own Cargo.lock.
exclude = ["crates/wm-host/tests/fixtures", "compiler/js-engine/upstream-343/runner"]

[workspace.package]
edition = "2024"
# Floor, not a pin: rust-toolchain.toml selects `stable`, but that resolves
# to whatever stable a contributor already has installed. wasmtime 48 needs
# 1.95, so without this a 1.94 toolchain fails deep in a dependency build
# instead of saying which rustc it wants. Raise it when a dependency does.
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/einarfd/wiremirage"
authors = ["Einar Fløystad Dørum <einarfd@mailthief.com>"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "metrics"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace", "metrics"] }
wasmtime = "48"
axum = "0.8"
http = "1"
hyper = { version = "1", features = ["http1", "server"] }
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "rustls", "stream"] }
redis = "1"
testcontainers = { version = "0.28", features = ["blocking"] }
ulid = "3"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rand = "0.10"
sha2 = "0.11"
hex = "0.4"
clap = { version = "4", features = ["derive", "env"] }
assert_cmd = "2"
rmcp = { version = "3.1", default-features = false, features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
schemars = { version = "1", features = ["chrono04"] }
# Pure-Rust TypeScript transpile (ADR-0020 slice B, ADR-0038). Declared at
# workspace level because wm-transpile and wm-host's build script both pull
# the same set; one version, one compile.
swc_common = "26"
swc_ecma_ast = "29"
swc_ecma_parser = { version = "45", features = ["typescript"] }
swc_ecma_transforms_typescript = "55"
swc_ecma_codegen = "32"

[profile.release]
lto = "thin"
codegen-units = 1

# Strip debug info from third-party dependencies (wasmtime / cranelift /
# swc dominate the tree). Our own crates keep full debug info, so
# backtraces and debugger stepping through wm-* code are unaffected; we
# only lose line info inside dependencies, which we rarely step into.
# The payoff is much smaller object files -> faster linking (every
# wm-host integration test statically links the whole tree) and a far
# smaller target/ dir. Does not affect the wasm32 fixture sub-builds:
# build.rs spawns those as separate cargo invocations with their own
# profile, so this stanza never reaches them.
[profile.dev.package."*"]
debug = false
